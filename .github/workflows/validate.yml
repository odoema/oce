name: Validate OCE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax and duplicate-global check
        run: npm run check

      - name: Test suite (mock Apps Script runtime)
        run: npm test

      - name: Refuse obvious secret files
        run: |
          ! find . -type f \( -name '*.env' -o -name '.clasprc.json' -o -name 'credentials.json' -o -name 'service-account*.json' -o -name 'client_secret*.json' \) -not -path './.git/*' | grep -q .
          ! grep -rEn "re_[A-Za-z0-9]{20,}|BSA[A-Za-z0-9_-]{20,}" apps-script web docs README.md
