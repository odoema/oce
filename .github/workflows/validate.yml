name: Validate OCE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f apps-script/Code.gs
          test -f apps-script/CollectorGateway.gs
          test -f apps-script/UrlScraper.gs
          test -f apps-script/SourceRegistry.gs
          test -f apps-script/QueueWorker.gs
          test -f apps-script/MissionOrchestrator.gs
          test -f apps-script/appsscript.json
          test -f web/index.html
          test -f web/app.js
          test -f web/discovery-brain.js
          test -f web/scout.js
          test -f web/mission-control.js
          test -f README.md
          test -f docs/security.md

      - name: Check frontend JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/discovery-brain.js
          node --check web/scout.js
          node --check web/mission-control.js

      - name: Check Apps Script syntax
        run: |
          node --check apps-script/SourceRegistry.gs
          node --check apps-script/QueueWorker.gs
          node --check apps-script/MissionOrchestrator.gs
          node --check apps-script/CollectorGateway.gs
          node --check apps-script/UrlScraper.gs

      - name: Check for obvious secret filenames
        run: |
          ! find . -type f \( -name '*.env' -o -name 'credentials.json' -o -name 'service-account*.json' -o -name 'client_secret*.json' \) -not -path './.git/*' | grep -q .
