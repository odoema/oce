name: Sync OCE Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.claspignore'
      - 'scripts/sync-apps-script.mjs'
      - '.github/workflows/apps-script-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oce-apps-script-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      OCE_APPS_SCRIPT_ID: 1__bAterCWQop83g_fgfmLi8ggBQwd6WzxI45veH_9Kk3rVBbSeHsG-qs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate required CI credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "Missing GitHub Actions secret: CLASPRC_JSON"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate Apps Script source set
        shell: bash
        run: |
          set -euo pipefail
          for file in apps-script/*.gs; do
            node --check < "$file"
          done
          node --check scripts/sync-apps-script.mjs
          node -e "JSON.parse(require('fs').readFileSync('apps-script/appsscript.json','utf8')); console.log('Manifest JSON: OK')"

      - name: Verify Apps Script project identity
        shell: bash
        run: |
          set -euo pipefail
          actual_id="$(node -e "console.log(JSON.parse(require('fs').readFileSync('.clasp.json','utf8')).scriptId)")"
          echo "Apps Script project: $actual_id"
          if [ "$actual_id" != "$OCE_APPS_SCRIPT_ID" ]; then
            echo "The checked-in .clasp.json does not target the canonical OCE Apps Script project."
            exit 1
          fi

      - name: Install Google API client
        run: npm install --no-save --no-package-lock googleapis@188.0.0

      - name: Sync GitHub source directly to Apps Script
        run: node scripts/sync-apps-script.mjs

      - name: Verify canonical OCE gateway health
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OCE_EFFECTIVE_WEB_APP_URL:-}" ]; then
            echo "Sync did not return an OCE web-app URL."
            exit 1
          fi
          echo "Verifying: ${OCE_EFFECTIVE_WEB_APP_URL}"
          response="$(curl -fsSL --retry 3 --retry-delay 2 --max-time 45 "${OCE_EFFECTIVE_WEB_APP_URL}?action=health")"
          echo "$response"
          node -e '
            const x = JSON.parse(process.argv[1]);
            if (!x.ok || x.service !== "OCE Collector Gateway") process.exit(1);
            if (x.version !== "4.1.0") {
              console.error(`Expected gateway 4.1.0, received ${x.version}`);
              process.exit(1);
            }
            console.log(`Gateway ${x.version}: ${x.status}`);
          ' "$response"

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
